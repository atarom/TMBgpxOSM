name: Deploy TMBgpxOSM
on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 3,15 * * *"
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.gtfs.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v7
      - id: gtfs
        run: |
          mkdir _site
          cp index.html style.css script.js simulation.js gpx.js gtfs.js osm-qa.js gtfs-cache.js favicon.ico _site/
          curl -L --fail --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 "https://t-mobilitat.cat/opendata/static/download/" -o _site/gtfs.zip
          unzip -t _site/gtfs.zip
          rm -rf _gtfs_hash
          mkdir _gtfs_hash
          unzip -qq _site/gtfs.zip -d _gtfs_hash
          NEW_HASH=$(find _gtfs_hash -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f1)
          printf '%s\n' "$NEW_HASH" > _site/gtfs-version.txt
          SHOULD_DEPLOY=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            OLD_HASH=$(curl -fsSL -H "Cache-Control: no-cache" "https://atarom.github.io/TMBgpxOSM/gtfs-version.txt?run=${GITHUB_RUN_ID}" || true)
            if [ "$NEW_HASH" = "$OLD_HASH" ]; then
              SHOULD_DEPLOY=false
            fi
          fi
          echo "should_deploy=$SHOULD_DEPLOY" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v6
        if: steps.gtfs.outputs.should_deploy == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.gtfs.outputs.should_deploy == 'true'
        with:
          path: _site
  deploy:
    if: needs.build.outputs.should_deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
